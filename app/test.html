<!doctype html>
<!-- test.html - tymczasowy frontend do testów, do usunięcia razem z trasą GET / w koma.js -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prawdowid test</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 16px; }
  #edytor { border: 1px solid #999; min-height: 200px; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #edytor:empty::before { content: attr(data-placeholder); color: #888; }
  #edytor img { max-width: 200px; max-height: 150px; display: block; margin: 4px 0; border: 1px solid #ccc; }
  button { margin-top: 12px; padding: 8px 20px; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>Prawdowid - test</h1>
<p>Wpisz tekst, wklej linki i zdjęcia (Ctrl+V) w jedno pole. Serwer sam je rozdzieli.</p>

<div id="edytor" contenteditable="true" data-placeholder="Tekst, linki, zdjęcia..."></div>
<p>Dodaj zdjęcia z dysku: <input type="file" id="pliki" accept="image/*" multiple></p>

<button id="wyslij">Wyślij na /api/weryfikuj</button>
<span id="czas"></span>

<h2>Wynik</h2>
<pre id="wynik">-</pre>

<script>
const $ = (id) => document.getElementById(id);
const edytor = $('edytor');

function jakoBase64(plik) {
  return new Promise((ok, blad) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => blad(r.error);
    r.readAsDataURL(plik);
  });
}

async function wstawZdjecia(pliki) {
  for (const plik of pliki) {
    if (!plik.type.startsWith('image/')) continue;
    const img = document.createElement('img');
    img.src = await jakoBase64(plik);
    edytor.appendChild(img);
  }
}

// Wklejanie: zdjęcia jako <img>, reszta jako czysty tekst (bez formatowania ze stron)
edytor.addEventListener('paste', async (e) => {
  e.preventDefault();
  const pliki = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
  if (pliki.length) return wstawZdjecia(pliki);
  document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});

$('pliki').onchange = (e) => wstawZdjecia([...e.target.files]);

// Zamienia zawartość edytora na jeden napis: tekst + zdjęcia jako data:image/...;base64,...
function naTekst(wezel) {
  let wynik = '';
  for (const n of wezel.childNodes) {
    if (n.nodeType === Node.TEXT_NODE) wynik += n.textContent;
    else if (n.nodeName === 'BR') wynik += '\n';
    else if (n.nodeName === 'IMG') wynik += n.src.startsWith('data:image/') ? `\n${n.src}\n` : '';
    else wynik += (/^(DIV|P)$/.test(n.nodeName) ? '\n' : '') + naTekst(n);
  }
  return wynik;
}

$('wyslij').onclick = async () => {
  $('wynik').textContent = 'Przetwarzanie... (OCR i filtrowanie mogą potrwać)';
  const start = Date.now();
  try {
    const odp = await fetch('/api/weryfikuj', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tekst: naTekst(edytor) }),
    });
    const dane = await odp.json();
    $('wynik').textContent = odp.ok ? dane.tekst : `HTTP ${odp.status}: ${dane.blad}`;
  } catch (e) {
    $('wynik').textContent = 'Błąd: ' + e.message;
  }
  $('czas').textContent = `${((Date.now() - start) / 1000).toFixed(1)} s`;
};
</script>
</body>
</html>
